<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Homepage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>

    <header class="topbar">
      <div class="brand" id="brand">Academic Homepage</div>
      <div class="controls">
        <a class="cv-link" id="cvLink" href="#" hidden>CV</a>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <nav class="tabs" id="tabs" aria-label="sections">
          <a href="#about" class="tab active" data-target="about">About</a>
          <!-- Data sections (Research / Publications / News / any extra sheet) are injected here -->
          <span id="dataTabs"></span>
          <a href="#contact" class="tab" data-target="contact">Contact</a>
        </nav>
      </aside>

      <section class="content">
        <div id="loadStatus" class="card status" aria-live="polite">
          Loading content.xlsx ...
        </div>

        <!-- About -->
        <section id="about" class="card section" hidden>
          <div class="about-head">
            <img id="photo" class="photo" alt="portrait" src="photo.svg" />
            <div class="about-meta">
              <h1 id="name">Name</h1>
              <p id="title" class="title"></p>
              <p id="affiliation" class="affiliation"></p>
              <div class="socials" id="socials"></div>
            </div>
          </div>
          <p id="bio" class="bio"></p>
        </section>

        <!-- Data sections (Research / Publications / News / extra sheets) are injected here -->
        <div id="dataSections"></div>

        <!-- Contact -->
        <section id="contact" class="card section" hidden>
          <h2 class="section-title">Contact</h2>
          <div id="contactList" class="stack"></div>
        </section>
      </section>
    </main>

    <footer class="footer">
      <span>Built with a free GitHub Pages template.</span>
    </footer>
  </body>
</html>
